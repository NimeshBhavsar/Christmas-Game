<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07071a" />
    <title>Santas Postfach · OneMachine</title>
    <meta name="description" content="Ein Retro-Weihnachtsspiel mit OneMachine – für jeden Besuch spenden wir an die Suppenküche der Franziskaner in Düsseldorf." />
    <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Pixelify+Sans:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="game">
      <header id="hud">
        <div class="hud-brand" aria-label="OneMachine"><span class="om-avatar">&gt;&gt;</span><span class="hud-title">OneMachine</span></div>
        <ol id="progress" aria-label="Level"></ol>
        <div class="hud-score" aria-label="Punkte"><span class="hud-star">★</span><span id="score">0000</span></div>
        <button id="mute" class="hud-btn" type="button" aria-label="Ton aus">♪</button>
        <button id="skip" class="hud-btn" type="button" hidden>SKIP &gt;&gt;</button>
      </header>
      <div id="play">
        <section id="stage-wrap">
          <div id="stage">
            <canvas id="world" aria-label="Spielwelt: Nordpol mit Santa, Kindern und Geschenkelager" role="img"></canvas>
            <div id="stage-ui"></div>
            <div id="dialog" class="dialog" hidden></div>
          </div>
        </section>
        <aside id="phone" aria-label="Santas iPhone mit OneMachine">
          <div class="phone-shell">
            <div class="phone-screen">
              <div class="ios-status" aria-hidden="true">
                <span class="ios-time" id="clock">18:00</span>
                <span class="ios-island"></span>
                <span class="ios-icons">
                  <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" /><rect x="5" y="5.5" width="3" height="6.500" rx="1" /><rect x="10" y="3" width="3" height="9" rx="1" /><rect x="15" y="0" width="3" height="12" rx="1" /></svg>
                  <svg viewBox="0 0 17 12"><path d="M8.5 2.700c2.300 0 4.400.900 6 2.400l1.200-1.300C13.800 2 11.300.900 8.500.900S3.200 2 1.300 3.800l1.200 1.300c1.600-1.500 3.700-2.400 6-2.400Zm0 3.400c1.400 0 2.700.500 3.700 1.400l1.200-1.300C12.100 5 10.400 4.300 8.500 4.300S4.900 5 3.600 6.200l1.200 1.300c1-.900 2.300-1.400 3.700-1.400Zm0 3.300c-.700 0-1.400.300-1.900.800L8.500 12l1.900-1.800c-.500-.500-1.200-.800-1.900-.800Z" /></svg>
                  <svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="22" height="11" rx="3.200" fill="none" stroke="currentColor" opacity=".45" /><rect x="2" y="2" width="19" height="8" rx="2" /><path d="M24 4v4c.800-.300 1.500-1.100 1.500-2s-.700-1.700-1.500-2Z" opacity=".5" /></svg>
                </span>
              </div>
              <main id="scene" tabindex="-1"></main>
              <div id="overlay"></div>
              <div class="ios-home" aria-hidden="true"></div>
            </div>
          </div>
        </aside>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
